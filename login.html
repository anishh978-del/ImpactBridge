<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImpactBridge Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#020b2d,#03133f,#061d5f);
  color:white;
}

.login-box{
  width:420px;
  padding:40px;
  border-radius:20px;
  background:rgba(255,255,255,0.04);
  box-shadow:0 0 30px rgba(0,0,0,0.4);
  text-align:center;
  backdrop-filter:blur(10px);
}

.logo{
  width:80px;
  height:80px;
  border-radius:50%;
  background:white;
  margin:auto;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 20px rgba(255,255,255,0.3);
  margin-bottom:18px;
}

.logo img{
  width:125px;
}

h1{
  font-size:38px;
  margin-bottom:8px;
}

.sub{
  color:#d0d0d0;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:10px;
  font-size:16px;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:15px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
}

.login-btn{
  background:#2563eb;
  color:white;
}

.signup-btn{
  background:#0f172a;
  color:white;
  border:1px solid #2563eb;
}

.google-btn{
  background:white;
  color:black;
  display:flex;
  align-items:center;
  gap:8px;
}

.google-btn img{
  width:18px;
}

.footer{
  margin-top:20px;
  color:#e8e0e0;
  font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    <img src="phots/logo.png">
  </div>

  <h1>ImpactBridge</h1>
  <div class="sub">NGO Connect Login</div>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <div class="buttons">
    <button class="login-btn" onclick="login()">Login</button>
    <button class="signup-btn" onclick="signup()">Sign Up</button>

    <button class="google-btn" onclick="googleLogin()">
      <img src="phots/google.png">
      Sign in with Google
    </button>
  </div>

  <div class="footer">
    Connecting NGOs, Changing Lives.
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrg8ZjMty5kNPd2DjNI3uIx5dktPf2R3I",
  authDomain: "impact-bridge-24051.firebaseapp.com",
  projectId: "impact-bridge-24051",
  storageBucket: "impact-bridge-24051.firebasestorage.app",
  messagingSenderId: "945399647935",
  appId: "1:945399647935:web:ab0390d2524ae4fed2c00a",
  measurementId: "G-EFQELZX0DC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.signup = async function () {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  try{
    await createUserWithEmailAndPassword(auth,email,pass);
    alert("Signup Success 🚀");
    window.location.href="index.html";
  }catch(error){
    alert(error.message);
  }
}

window.login = async function () {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  try{
    await signInWithEmailAndPassword(auth,email,pass);
    alert("Login Success 🚀");
    window.location.href="index.html";
  }catch(error){
    alert(error.message);
  }
}

window.googleLogin = async function () {
  try{
    const result = await signInWithPopup(auth,provider);
    alert("Welcome " + result.user.displayName);
    window.location.href="index.html";
  }catch(error){
    alert(error.message);
  }
}

</script>

</body>
</html>
