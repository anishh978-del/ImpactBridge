<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donor Dashboard</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

/* CONTAINER */
.container {
  max-width: 1000px;
  margin: auto;
}

/* TITLE */
h1 {
  text-align: center;
}

.sub {
  text-align: center;
  opacity: 0.7;
  margin-bottom: 30px;
}

/* SUMMARY BOXES */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.box {
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.box h2 {
  color: #22c55e;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #334155;
  text-align: center;
}

th {
  background: #1e293b;
}

/* BUTTON */
button {
  margin-top: 20px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #ef4444;
  color: white;
}

/* BACK */
.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #38bdf8;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 Donor Dashboard</h1>
<p class="sub">Track your contributions and impact</p>

<!-- SUMMARY -->
<div class="summary">
  <div class="box">
    <h3>Total Donated</h3>
    <h2 id="totalAmount">₹0</h2>
  </div>

  <div class="box">
    <h3>Total Donations</h3>
    <h2 id="totalCount">0</h2>
  </div>
</div>

<!-- TABLE -->
<h2>Recent Donations</h2>

<table id="donationTable">
  <tr>
    <th>Date</th>
    <th>Cause</th>
    <th>Amount</th>
  </tr>
</table>

<!-- RESET BUTTON -->
<button onclick="clearData()">Reset Data</button>

<a href="index.html" class="back">← Back to Home</a>

</div>

<script>
// LOAD DATA
let donations = JSON.parse(localStorage.getItem("donations")) || [];

let total = 0;
let table = document.getElementById("donationTable");

donations.forEach(d => {
  total += d.amount;

  let row = table.insertRow();
  row.innerHTML = `
    <td>${d.date}</td>
    <td>${d.cause}</td>
    <td>₹${d.amount}</td>
  `;
});

// UPDATE SUMMARY
document.getElementById("totalAmount").innerText = "₹" + total;
document.getElementById("totalCount").innerText = donations.length;

// CLEAR DATA
function clearData() {
  localStorage.removeItem("donations");
  location.reload();
}
</script>

</body>
</html>
