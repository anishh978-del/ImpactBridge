<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elite Donor Dashboard</title>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- MAP -->
<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>
body{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:white;
  font-family:Arial;
  padding:30px;
}

h1{text-align:center;margin-bottom:20px;}

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  padding:20px;
  border-radius:12px;
}

.chart-box{
  margin-top:40px;
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:12px;
}

.chart-container{
  max-width:600px;
  height:300px;
  margin:20px auto;
}

.top-card{
  background:rgba(255,255,255,0.05);
  padding:10px;
  margin:8px 0;
  border-radius:8px;
}

.reset-btn{
  margin-top:20px;
  padding:10px;
  background:#ef4444;
  border:none;
  color:white;
  border-radius:6px;
}
</style>
</head>

<body>

<h1>🚀 Donor Dashboard</h1>

<div class="dashboard">

<div class="card">
<h3>Total</h3>
<h2 id="total"></h2>
</div>

<div class="card">
<h3>Top NGO</h3>
<h2 id="topNGO"></h2>
</div>

<div class="card">
<h3>Donations</h3>
<h2 id="count"></h2>
</div>

<div class="card">
<h3>Recent</h3>
<p id="recent"></p>
</div>

<div class="card">
<h3>🤖 AI Suggestion</h3>
<h2 id="aiNGO"></h2>
<p id="aiReason"></p>
</div>

</div>

<button class="reset-btn" onclick="resetData()">Reset Data</button>

<h2>🏆 Top Donors</h2>
<div id="topList"></div>

<h2>📜 History</h2>
<table width="100%" border="1">
<tbody id="table"></tbody>
</table>

<!-- CHARTS -->
<div class="chart-box">
<h2>📊 Charts</h2>
<div class="chart-container"><canvas id="bar"></canvas></div>
<div class="chart-container"><canvas id="pie"></canvas></div>
<div class="chart-container"><canvas id="line"></canvas></div>
</div>

<!-- MAP -->
<div class="chart-box">
<h2>🌍 Click State to Donate</h2>
<div id="indiaMap" style="width:100%;height:400px;"></div>
</div>

<script>

let donations = JSON.parse(localStorage.getItem("donations")) || [];

// TOTAL
let total=0;
donations.forEach(d=> total+=Number(d.amount));
document.getElementById("total").innerText="₹"+total;

// COUNT
document.getElementById("count").innerText=donations.length;

// RECENT
if(donations.length){
 let last=donations[donations.length-1];
 document.getElementById("recent").innerText=
 `${last.donor} → ₹${last.amount}`;
}

// NGO TOTALS
let ngoTotals={};
donations.forEach(d=>{
 if(!ngoTotals[d.ngo]) ngoTotals[d.ngo]=0;
 ngoTotals[d.ngo]+=Number(d.amount);
});

// TOP NGO
let topNGO="";
let max=0;
for(let n in ngoTotals){
 if(ngoTotals[n]>max){max=ngoTotals[n];topNGO=n;}
}
document.getElementById("topNGO").innerText=topNGO;

// TOP DONORS
donations.sort((a,b)=>b.amount-a.amount);
let html="";
donations.slice(0,5).forEach(d=>{
 html+=`<div class="top-card">₹${d.amount} - ${d.donor}</div>`;
});
document.getElementById("topList").innerHTML=html;

// AI
function getAI(){
 if(donations.length===0){
  return {ngo:"Pratham",reason:"Start donating 📚"};
 }
 return {ngo:topNGO,reason:"Most impactful NGO 🔥"};
}
let ai=getAI();
document.getElementById("aiNGO").innerText=ai.ngo;
document.getElementById("aiReason").innerText=ai.reason;

// CHARTS
let labels=Object.keys(ngoTotals);
let data=Object.values(ngoTotals);

new Chart(document.getElementById("bar"),{
 type:"bar",
 data:{labels:labels,datasets:[{data:data}]}
});

new Chart(document.getElementById("pie"),{
 type:"doughnut",
 data:{labels:labels,datasets:[{data:data}]}
});

// LINE
let dateTotals={};
donations.forEach(d=>{
 if(!dateTotals[d.date]) dateTotals[d.date]=0;
 dateTotals[d.date]+=Number(d.amount);
});

new Chart(document.getElementById("line"),{
 type:"line",
 data:{
  labels:Object.keys(dateTotals),
  datasets:[{data:Object.values(dateTotals)}]
 }
});

// RESET
function resetData(){
 if(confirm("Delete all?")){
  localStorage.clear();
  location.reload();
 }
}

// MAP
google.charts.load('current',{packages:['geochart']});
google.charts.setOnLoadCallback(drawMap);

function drawMap(){

 let stateTotals={};

 donations.forEach(d=>{
  let state=d.state||"Karnataka";
  if(!stateTotals[state]) stateTotals[state]=0;
  stateTotals[state]+=Number(d.amount);
 });

 let arr=[['State','Donations']];
 for(let s in stateTotals){
  arr.push([s,stateTotals[s]]);
 }

 let data=google.visualization.arrayToDataTable(arr);

 let chart=new google.visualization.GeoChart(document.getElementById('indiaMap'));

 chart.draw(data,{
  region:'IN',
  resolution:'provinces'
 });

 // CLICK EVENT
 google.visualization.events.addListener(chart,'select',function(){
  let sel=chart.getSelection();
  if(sel.length>0){
   let state=data.getValue(sel[0].row,0);
   localStorage.setItem("selectedState",state);
   window.location.href="donate.html";
  }
 });

}

</script>

</body>
</html>
