<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Donate</title>

<link rel="stylesheet" href="donate.css">
</head>

<body>

<h1>Select NGO & Donate ❤️</h1>

<!-- FILTER -->
<div class="top-bar">
<select id="stateFilter" onchange="filterNGO()">
  <option value="all">All States</option>
  <option value="Maharashtra">Maharashtra</option>
  <option value="Gujarat">Gujarat</option>
  <option value="Delhi">Delhi</option>
  <option value="Karnataka">Karnataka</option>
</select>
</div>

<!-- NGO GRID -->
<div class="grid" id="ngoGrid">

<div class="card" data-state="Maharashtra" onclick="selectNGO(this,'Pratham')">
  <img src="phots/pratham.png">
  <h3>Pratham</h3>
  <p>Education</p>
</div>

<div class="card" data-state="Gujarat" onclick="selectNGO(this,'SEWA')">
  <img src="phots/seva.png">
  <h3>SEWA</h3>
  <p>Women Empowerment</p>
</div>

<div class="card" data-state="Delhi" onclick="selectNGO(this,'Goonj')">
  <img src="phots/goon.png">
  <h3>Goonj</h3>
  <p>Relief Work</p>
</div>

<div class="card" data-state="Karnataka" onclick="selectNGO(this,'Akshaya Patra')">
  <img src="phots/aksh.png">
  <h3>Akshaya Patra</h3>
  <p>Food</p>
</div>

<div class="card" data-state="India" onclick="selectNGO(this,'CRY')">
  <img src="phots/cry.png">
  <h3>CRY</h3>
  <p>Child Rights</p>
</div>

<div class="card" data-state="India" onclick="selectNGO(this,'Teach For India')">
  <img src="phots/tech.png">
  <h3>Teach For India</h3>
  <p>Education</p>
</div>

</div>

<!-- FORM -->
<div class="form-box">

<h2>Donate</h2>

<input id="ngoName" placeholder="Selected NGO" readonly>
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">
<input id="amount" type="number" placeholder="Amount ₹">

<button onclick="goToPayment()">Proceed to Pay</button>

</div>

<script>

// SELECT NGO
function selectNGO(card, name){
  document.getElementById("ngoName").value = name;

  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
  card.classList.add("active");
}

// FILTER NGOs
function filterNGO(){
  let val = document.getElementById("stateFilter").value;
  let cards = document.querySelectorAll(".card");

  cards.forEach(card=>{
    if(val==="all" || card.dataset.state===val){
      card.style.display="block";
    } else {
      card.style.display="none";
    }
  });
}

// AUTO FILTER FROM MAP
window.onload = function(){

  let state = localStorage.getItem("selectedState");

  if(state){
    document.getElementById("stateFilter").value = state;
    filterNGO();

    document.getElementById("ngoGrid").scrollIntoView({
      behavior:"smooth"
    });

    localStorage.removeItem("selectedState");
  }

  // Ripple Effect
  document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", function(e){
      let ripple = document.createElement("span");

      ripple.style.position = "absolute";
      ripple.style.width = ripple.style.height = "100px";
      ripple.style.background = "rgba(255,255,255,0.3)";
      ripple.style.borderRadius = "50%";
      ripple.style.left = e.offsetX + "px";
      ripple.style.top = e.offsetY + "px";
      ripple.style.transform = "translate(-50%, -50%)";
      ripple.style.animation = "ripple 0.6s linear";

      this.appendChild(ripple);
      setTimeout(()=> ripple.remove(), 600);
    });
  });

}

// GO TO PAYMENT (FINAL FIXED)
function goToPayment(){

  let ngo = document.getElementById("ngoName").value;
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let amt = document.getElementById("amount").value;
  let state = document.getElementById("stateFilter").value;

  if(!ngo || !name || !phone || !amt){
    alert("⚠️ Please fill all details");
    return;
  }

  const donation = {
    donor: name,
    phone: phone,
    ngo: ngo,
    amount: parseFloat(amt),
    state: state,
    date: new Date().toLocaleDateString()
  };

  localStorage.setItem("currentDonation", JSON.stringify(donation));

  window.location.href = "payment.html";
}

</script>

</body>
</html>
